name: Image pipeline (reusable)
# Orchestrates build → scan → push for a single image.
# Caller supplies matrix; this workflow handles one entry.
# I4 guarantee: sha-tag is computed once in the `tag` job and shared across all steps.

on:
  workflow_call:
    inputs:
      name:
        description: Image name suffix (e.g. scoreboard → falco-ctf-scoreboard)
        required: true
        type: string
      context:
        description: Docker build context path (relative to repo root)
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile (relative to repo root)
        required: true
        type: string
      push:
        description: Push image to ECR after successful scan
        type: boolean
        default: false
      registry:
        description: ECR registry URL (required when push=true)
        type: string
        default: ""
      aws-region:
        description: AWS region for ECR (required when push=true)
        type: string
        default: ""
      scan-continue-on-error:
        description: |
          false (default): policy violations fail the job and block the PR.
          true: scan runs but failures are non-blocking (SARIF still uploaded).
        type: boolean
        default: false
      severity-at-least:
        type: string
        default: high
      cli-scanner-version:
        type: string
        default: "1.26.0"
      sysdig-secure-url:
        type: string
        default: https://app.au1.sysdig.com
      artifact-retention-days:
        type: number
        default: 1
    secrets:
      sysdig-token:
        required: true
      aws-role-arn:
        description: IAM role ARN for ECR push (required when push=true)
        required: false
    outputs:
      sha-tag:
        description: 7-char SHA tag used for the build
        value: ${{ jobs.tag.outputs.sha-tag }}
      release-tag:
        description: Release tag (empty when not a release)
        value: ${{ jobs.tag.outputs.release-tag }}

permissions: {}

jobs:
  # ------------------------------------------------------------------
  # 0. Validate inputs once, fail-fast before anything else runs.
  # ------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      NAME: ${{ inputs.name }}
      CONTEXT: ${{ inputs.context }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      REGISTRY: ${{ inputs.registry }}
      AWS_REGION: ${{ inputs.aws-region }}
      PUSH: ${{ inputs.push }}
    steps:
      - name: Validate
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::name must match ^[a-z0-9-]+$"; exit 1
          fi
          for path_var in CONTEXT DOCKERFILE; do
            v="${!path_var}"
            if [[ ! "$v" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$v" =~ \.\. ]]; then
              echo "::error::${path_var,,} must match ^[A-Za-z0-9._/-]+$ and not contain '..'"
              exit 1
            fi
          done
          if [[ "$PUSH" == "true" ]]; then
            if [[ ! "$REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?$ ]]; then
              echo "::error::registry is required and must look like an ECR URL when push=true"; exit 1
            fi
            if [[ ! "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
              echo "::error::aws-region is required when push=true"; exit 1
            fi
          fi

  # ------------------------------------------------------------------
  # 1. Compute tag — single source of truth for this pipeline run (I4)
  # ------------------------------------------------------------------
  tag:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      sha-tag: ${{ steps.compute.outputs.sha-tag }}
      release-tag: ${{ steps.compute.outputs.release-tag }}
      is-release: ${{ steps.compute.outputs.is-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compute tag
        id: compute
        uses: Qfour/qfour-workflows/.github/actions/compute-tag@v1

  # ------------------------------------------------------------------
  # 2. Build image → upload artifact
  # ------------------------------------------------------------------
  build:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NAME: ${{ inputs.name }}
      SHA_TAG: ${{ needs.tag.outputs.sha-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: falco-ctf-${{ inputs.name }}:${{ needs.tag.outputs.sha-tag }}

      - name: Save image
        run: |
          set -euo pipefail
          docker save "falco-ctf-${NAME}:${SHA_TAG}" -o "${NAME}.tar"

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: docker-image-${{ inputs.name }}
          path: ${{ inputs.name }}.tar
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. Sysdig scan
  #    continue-on-error is configurable per caller (default: blocking)
  # ------------------------------------------------------------------
  scan:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.scan-continue-on-error }}
    permissions:
      contents: read
      security-events: write
    env:
      NAME: ${{ inputs.name }}
      SHA_TAG: ${{ needs.tag.outputs.sha-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: docker-image-${{ inputs.name }}

      - name: Load Docker image
        run: |
          set -euo pipefail
          docker load -i "${NAME}.tar"

      - name: Sysdig CLI Scanner
        uses: sysdiglabs/scan-action@607e6bc13f737906e66e81d98e74a69cf356af08 # v6.3.6
        with:
          image-tag: falco-ctf-${{ inputs.name }}:${{ needs.tag.outputs.sha-tag }}
          sysdig-secure-token: ${{ secrets.sysdig-token }}
          sysdig-secure-url: ${{ inputs.sysdig-secure-url }}
          cli-scanner-version: ${{ inputs.cli-scanner-version }}
          stop-on-failed-policy-eval: true
          severity-at-least: ${{ inputs.severity-at-least }}

      - name: Upload SARIF report
        if: always() && hashFiles('sarif.json') != ''
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        with:
          sarif_file: ${{ github.workspace }}/sarif.json
          category: sysdig-${{ inputs.name }}

  # ------------------------------------------------------------------
  # 4. Push to ECR
  #    Skipped when push=false (PRs) or when scan failed and blocking.
  #    On release: pushes both sha-tag AND release-tag.
  # ------------------------------------------------------------------
  push:
    needs: [tag, build, scan]
    if: |
      always() &&
      inputs.push == true &&
      needs.build.result == 'success' &&
      needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for ECR
    env:
      NAME: ${{ inputs.name }}
      SHA_TAG: ${{ needs.tag.outputs.sha-tag }}
      RELEASE_TAG: ${{ needs.tag.outputs.release-tag }}
      IS_RELEASE: ${{ needs.tag.outputs.is-release }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: docker-image-${{ inputs.name }}

      - name: Load Docker image
        run: |
          set -euo pipefail
          docker load -i "${NAME}.tar"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: ECR login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push SHA tag
        run: |
          set -euo pipefail
          IMAGE_SHA="${REGISTRY}/falco-ctf-${NAME}:${SHA_TAG}"
          docker tag "falco-ctf-${NAME}:${SHA_TAG}" "${IMAGE_SHA}"
          docker push "${IMAGE_SHA}"

      - name: Push release tag
        if: needs.tag.outputs.is-release == 'true' && needs.tag.outputs.release-tag != ''
        run: |
          set -euo pipefail
          IMAGE_SHA="${REGISTRY}/falco-ctf-${NAME}:${SHA_TAG}"
          IMAGE_REL="${REGISTRY}/falco-ctf-${NAME}:${RELEASE_TAG}"
          docker tag "${IMAGE_SHA}" "${IMAGE_REL}"
          docker push "${IMAGE_REL}"
