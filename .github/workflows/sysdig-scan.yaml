name: Sysdig scan (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Image name suffix (e.g. scoreboard)
        required: true
        type: string
      sha-tag:
        description: Image tag to scan (7-char SHA)
        required: true
        type: string
      artifact-name:
        description: Artifact name containing the image tar
        required: true
        type: string
      severity-at-least:
        description: Minimum severity to report (critical/high/medium/low)
        type: string
        default: high
      cli-scanner-version:
        type: string
        default: "1.26.0"
      sysdig-secure-url:
        type: string
        default: https://app.au1.sysdig.com
      continue-on-error:
        description: |
          When true, scan failures do NOT fail the workflow (SARIF is still uploaded).
          Default false = policy violations block the PR.
        type: boolean
        default: false
    secrets:
      sysdig-token:
        required: true

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.continue-on-error }}
    permissions:
      contents: read
      security-events: write
    env:
      NAME: ${{ inputs.name }}
      SHA_TAG: ${{ inputs.sha-tag }}
      SEVERITY: ${{ inputs.severity-at-least }}
      SCANNER_VERSION: ${{ inputs.cli-scanner-version }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::name must match ^[a-z0-9-]+$"
            exit 1
          fi
          if [[ ! "$SHA_TAG" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::sha-tag must be a 7-40 char hex string"
            exit 1
          fi
          case "$SEVERITY" in
            critical|high|medium|low) ;;
            *) echo "::error::severity-at-least must be one of critical/high/medium/low"; exit 1 ;;
          esac
          if [[ ! "$SCANNER_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::cli-scanner-version must look like X or X.Y or X.Y.Z"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}

      - name: Load Docker image
        run: |
          set -euo pipefail
          docker load -i "${NAME}.tar"

      - name: Sysdig CLI Scanner
        id: scan
        uses: sysdiglabs/scan-action@607e6bc13f737906e66e81d98e74a69cf356af08 # v6.3.6
        with:
          image-tag: falco-ctf-${{ inputs.name }}:${{ inputs.sha-tag }}
          sysdig-secure-token: ${{ secrets.sysdig-token }}
          sysdig-secure-url: ${{ inputs.sysdig-secure-url }}
          cli-scanner-version: ${{ inputs.cli-scanner-version }}
          stop-on-failed-policy-eval: true
          severity-at-least: ${{ inputs.severity-at-least }}

      - name: Upload SARIF report
        if: always() && hashFiles('sarif.json') != ''
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: ${{ github.workspace }}/sarif.json
          category: sysdig-${{ inputs.name }}
