name: Image push to ECR (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Image name suffix (e.g. scoreboard)
        required: true
        type: string
      sha-tag:
        description: 7-char SHA tag (always pushed)
        required: true
        type: string
      release-tag:
        description: Release tag (e.g. v2026.06.01-ctf). Empty string = skip release tag push
        type: string
        default: ""
      is-release:
        description: Whether to push the release tag in addition to sha-tag
        type: boolean
        default: false
      registry:
        description: ECR registry URL (e.g. 123456789.dkr.ecr.ap-northeast-1.amazonaws.com)
        required: true
        type: string
      aws-region:
        description: AWS region for ECR
        required: true
        type: string
      artifact-name:
        description: Artifact name containing the image tar
        required: true
        type: string
    secrets:
      aws-role-arn:
        description: IAM role ARN for ECR push (OIDC)
        required: true

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for ECR
    env:
      NAME: ${{ inputs.name }}
      SHA_TAG: ${{ inputs.sha-tag }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      REGISTRY: ${{ inputs.registry }}
      AWS_REGION: ${{ inputs.aws-region }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::name must match ^[a-z0-9-]+$"
            exit 1
          fi
          if [[ ! "$SHA_TAG" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::sha-tag must be a 7-40 char hex string"
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]] && [[ ! "$RELEASE_TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "::error::release-tag must match ^v[A-Za-z0-9._-]+$ when set"
            exit 1
          fi
          # ECR registry pattern: <id>.dkr.ecr.<region>.amazonaws.com[.cn]
          if [[ ! "$REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?$ ]]; then
            echo "::error::registry does not look like an ECR registry"
            exit 1
          fi
          if [[ ! "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
            echo "::error::aws-region must look like ap-northeast-1"
            exit 1
          fi

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      - name: Load Docker image
        run: |
          set -euo pipefail
          docker load -i "${NAME}.tar"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: ECR login
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Push SHA tag
        run: |
          set -euo pipefail
          IMAGE_SHA="${REGISTRY}/falco-ctf-${NAME}:${SHA_TAG}"
          docker tag "falco-ctf-${NAME}:${SHA_TAG}" "${IMAGE_SHA}"
          docker push "${IMAGE_SHA}"

      - name: Push release tag
        if: inputs.is-release && inputs.release-tag != ''
        run: |
          set -euo pipefail
          IMAGE_SHA="${REGISTRY}/falco-ctf-${NAME}:${SHA_TAG}"
          IMAGE_REL="${REGISTRY}/falco-ctf-${NAME}:${RELEASE_TAG}"
          docker tag "${IMAGE_SHA}" "${IMAGE_REL}"
          docker push "${IMAGE_REL}"
