name: Go test (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to test Dockerfile (relative to repo root)
        type: string
        default: Dockerfile.test

permissions: {}

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCKERFILE: ${{ inputs.dockerfile }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "$DOCKERFILE" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::dockerfile must match ^[A-Za-z0-9._/-]+$ (got: $DOCKERFILE)"
            exit 1
          fi
          if [[ "$DOCKERFILE" =~ \.\. ]]; then
            echo "::error::dockerfile must not contain '..'"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Go vet + test
        run: docker build -f "$DOCKERFILE" --progress=plain .
